<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>KIS Warehouse - Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    h2 { margin: 0 0 12px 0; font-size: 1.2rem; color: #00e676; }
    
    /* ปุ่มสลับโหมด Inbound / Outbound */
    .mode-switch {
      display: flex;
      max-width: 450px;
      margin: 0 auto 12px auto;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 4px;
      border: 1px solid #333;
    }
    .mode-btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #888;
      cursor: pointer;
      transition: 0.2s;
    }
    .mode-btn.active-inbound {
      background: #00e676;
      color: #000;
    }
    .mode-btn.active-outbound {
      background: #2979ff;
      color: #fff;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
      display: none;
    }
    .status-box {
      margin: 14px auto;
      padding: 14px;
      max-width: 420px;
      border-radius: 10px;
      background: #1e1e1e;
      font-size: 1rem;
    }
    .input-group {
      margin: 10px auto;
      max-width: 450px;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
    }
    .action-btn {
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #00e676;
      color: #000;
      cursor: pointer;
    }
    #startBtn {
      width: 100%;
      max-width: 450px;
      margin-bottom: 12px;
      padding: 14px;
      font-size: 1.05rem;
    }
    .history {
      max-width: 450px;
      margin: 16px auto;
      text-align: left;
    }
    .history-item {
      background: #1e1e1e;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #00e676;
    }
    .history-item.outbound { border-left-color: #2979ff; }
    .history-item.dup { border-left-color: #ff9100; }
    .badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge.in { background: rgba(0, 230, 118, 0.2); color: #00e676; }
    .badge.out { background: rgba(41, 121, 255, 0.2); color: #64b5f6; }
    .time { font-size: 0.8rem; color: #aaa; }
  </style>
</head>
<body>

  <h2 id="headerTitle">📦 KIS Scanner (INBOUND)</h2>

  <!-- ปุ่มเลือกโหมด Inbound / Outbound -->
  <div class="mode-switch">
    <button id="btnInbound" class="mode-btn active-inbound" onclick="setMode('Inbound')">📥 Inbound (รับเข้า)</button>
    <button id="btnOutbound" class="mode-btn" onclick="setMode('Outbound')">📤 Outbound (ส่งออก)</button>
  </div>

  <!-- ช่อง Note เสริม (ค้างค่าไว้ให้ เผื่อยิงรวดเดียวหลายกล่องในรอบเดียวกัน) -->
  <div class="input-group">
    <input type="text" id="noteInput" placeholder="Note (เช่น โกดัง Chiba, รอบเรือ 25/11)...">
  </div>
  
  <button id="startBtn" class="action-btn" onclick="startCamera()">📷 กดเพื่อเปิดกล้องสแกน</button>
  <div id="reader"></div>

  <div class="status-box" id="status">โหมดปัจจุบัน: <b>Inbound (รับเข้า)</b></div>

  <div class="input-group">
    <input type="text" id="manualTracking" placeholder="หรือพิมพ์เลข Tracking..." onkeypress="if(event.key==='Enter') submitManual()">
    <button id="submitBtn" class="action-btn" onclick="submitManual()">บันทึก</button>
  </div>

  <div class="history" id="historyList"></div>

  <script>
    // ใส่ Web App URL ของ Google Apps Script ตรงนี้
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

    let currentMode = 'Inbound';
    let isProcessing = false;
    let lastScanned = "";
    let lastScanTime = 0;
    const html5QrCode = new Html5Qrcode("reader");

    function setMode(mode) {
      currentMode = mode;
      lastScanned = ""; // รีเซ็ตกันซ้ำเผื่อสลับโหมดแล้วยิงกล่องเดิมทันที
      
      const btnIn = document.getElementById('btnInbound');
      const btnOut = document.getElementById('btnOutbound');
      const header = document.getElementById('headerTitle');
      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');
      const submitBtn = document.getElementById('submitBtn');

      if (mode === 'Inbound') {
        btnIn.className = 'mode-btn active-inbound';
        btnOut.className = 'mode-btn';
        header.innerText = '📦 KIS Scanner (INBOUND)';
        header.style.color = '#00e676';
        startBtn.style.background = '#00e676';
        startBtn.style.color = '#000';
        submitBtn.style.background = '#00e676';
        submitBtn.style.color = '#000';
        statusEl.innerHTML = 'โหมดปัจจุบัน: <b style="color:#00e676;">Inbound (รับเข้า)</b>';
      } else {
        btnIn.className = 'mode-btn';
        btnOut.className = 'mode-btn active-outbound';
        header.innerText = '🚚 KIS Scanner (OUTBOUND)';
        header.style.color = '#64b5f6';
        startBtn.style.background = '#2979ff';
        startBtn.style.color = '#fff';
        submitBtn.style.background = '#2979ff';
        submitBtn.style.color = '#fff';
        statusEl.innerHTML = 'โหมดปัจจุบัน: <b style="color:#64b5f6;">Outbound (ส่งออก)</b>';
      }
    }

    function playBeep(isSuccess = true) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = isSuccess ? 'sine' : 'sawtooth';
      osc.frequency.setValueAtTime(isSuccess ? 1000 : 300, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    }

    function startCamera() {
      const startBtn = document.getElementById('startBtn');
      const readerEl = document.getElementById('reader');
      const statusEl = document.getElementById('status');

      startBtn.style.display = 'none';
      readerEl.style.display = 'block';
      statusEl.innerText = "กำลังเปิดกล้อง...";

      html5QrCode.start(
        { facingMode: "environment" },
        {
          fps: 15,
          qrbox: { width: 280, height: 140 },
          aspectRatio: 1.5
        },
        onScanSuccess
      ).then(() => {
        statusEl.innerHTML = `พร้อมสแกน (${currentMode})...`;
        statusEl.style.color = "#ffffff";
      }).catch(err => {
        startBtn.style.display = 'inline-block';
        readerEl.style.display = 'none';
        statusEl.innerText = "ไม่สามารถเปิดกล้องได้: " + err;
        statusEl.style.color = "#ff5252";
      });
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (isProcessing || (decodedText === lastScanned && now - lastScanTime < 3000)) {
        return;
      }

      isProcessing = true;
      lastScanned = decodedText;
      lastScanTime = now;

      playBeep(true);
      if (navigator.vibrate) navigator.vibrate(100);

      processTracking(decodedText);
    }

    function submitManual() {
      const input = document.getElementById('manualTracking');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      processTracking(val);
    }

    async function processTracking(tracking) {
      const statusEl = document.getElementById('status');
      const noteVal = document.getElementById('noteInput').value.trim();
      
      statusEl.innerHTML = `⏳ กำลังบันทึก [${currentMode}]: <b>${tracking}</b>...`;
      statusEl.style.color = '#ffd600';

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ 
            tracking: tracking,
            status: currentMode,
            note: noteVal
          })
        });
        const res = await response.json();
        isProcessing = false;

        if (res.success) {
          if (res.isDuplicate) {
            playBeep(false);
            statusEl.innerHTML = `⚠️ <b>ยิงซ้ำ (${res.status})!</b> ${res.tracking}<br><small>${res.timestamp}</small>`;
            statusEl.style.color = '#ff9100';
          } else {
            const color = res.status === 'Inbound' ? '#00e676' : '#64b5f6';
            statusEl.innerHTML = `✅ <b>บันทึก ${res.status}:</b> ${res.tracking}<br><small>${res.timestamp} ${res.note ? '| ' + res.note : ''}</small>`;
            statusEl.style.color = color;
          }
          addHistory(res);
        } else {
          throw new Error(res.error || 'Unknown error');
        }
      } catch (err) {
        isProcessing = false;
        statusEl.innerHTML = `❌ เกิดข้อผิดพลาด: ${err.message}`;
        statusEl.style.color = '#ff5252';
      }
    }

    function addHistory(res) {
      const list = document.getElementById('historyList');
      const div = document.createElement('div');
      const isOut = res.status === 'Outbound';
      div.className = 'history-item' + (isOut ? ' outbound' : '') + (res.isDuplicate ? ' dup' : '');
      div.innerHTML = `
        <div>
          <strong>${res.tracking}</strong> <span class="badge ${isOut ? 'out' : 'in'}">${res.status}</span><br>
          <span class="time">${res.timestamp} ${res.note ? '• ' + res.note : ''}</span>
        </div>
        <div>${res.isDuplicate ? '⚠️ ซ้ำ' : '✅'}</div>
      `;
      list.prepend(div);
    }
  </script>
</body>
</html>
