<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>KIS Warehouse - Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    h2 { margin: 0 0 12px 0; font-size: 1.2rem; color: #00e676; }
    
    .mode-switch {
      display: flex;
      max-width: 450px;
      margin: 0 auto 10px auto;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 4px;
      border: 1px solid #333;
    }
    .mode-btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #888;
      cursor: pointer;
      transition: 0.2s;
    }
    .mode-btn.active-inbound { background: #00e676; color: #000; }
    .mode-btn.active-outbound { background: #2979ff; color: #fff; }

    .photo-toggle {
      max-width: 450px;
      margin: 0 auto 10px auto;
      background: #1e1e1e;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }
    .photo-toggle input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #00e676;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
      display: none;
    }
    .status-box {
      margin: 12px auto;
      padding: 14px;
      max-width: 420px;
      border-radius: 10px;
      background: #1e1e1e;
      font-size: 1rem;
    }
    .input-group {
      margin: 10px auto;
      max-width: 450px;
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
    }
    .action-btn {
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #00e676;
      color: #000;
      cursor: pointer;
    }
    #startBtn {
      width: 100%;
      max-width: 450px;
      margin-bottom: 12px;
      padding: 14px;
      font-size: 1.05rem;
    }
    #extraPhotoBtn {
      width: 100%;
      max-width: 450px;
      margin: 12px auto 0 auto;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #ffd600;
      color: #000;
      cursor: pointer;
      display: none;
    }
    #extraPhotoBtn:disabled {
      background: #555;
      color: #999;
      cursor: not-allowed;
    }

    .history {
      max-width: 450px;
      margin: 16px auto;
      text-align: left;
    }
    .history-item {
      background: #1e1e1e;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #00e676;
    }
    .history-item.outbound { border-left-color: #2979ff; }
    .history-item.dup { border-left-color: #ff9100; }
    .history-item.extra { border-left-color: #ffd600; }
    .badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge.in { background: rgba(0, 230, 118, 0.2); color: #00e676; }
    .badge.out { background: rgba(41, 121, 255, 0.2); color: #64b5f6; }
    .badge.extra { background: rgba(255, 214, 0, 0.2); color: #ffd600; }
    .photo-link {
      color: #ffd600;
      text-decoration: none;
      font-size: 0.85rem;
      margin-left: 6px;
    }
    .time { font-size: 0.8rem; color: #aaa; }
  </style>
</head>
<body>

  <h2 id="headerTitle">📦 KIS Scanner (INBOUND)</h2>

  <div class="mode-switch">
    <button id="btnInbound" class="mode-btn active-inbound" onclick="setMode('Inbound')">📥 Inbound (รับเข้า)</button>
    <button id="btnOutbound" class="mode-btn" onclick="setMode('Outbound')">📤 Outbound (ส่งออก)</button>
  </div>

  <div class="photo-toggle">
    <span>ถ่ายรูปอัตโนมัติทันทีที่ยิงบาร์โค้ด</span>
    <input type="checkbox" id="autoPhoto">
  </div>

  <div class="input-group">
    <input type="text" id="noteInput" placeholder="Note (เช่น โกดัง Chiba, รอบเรือ 25/11)...">
  </div>
  
  <button id="startBtn" class="action-btn" onclick="startCamera()">📷 กดเพื่อเปิดกล้องสแกน</button>
  <div id="reader"></div>

  <button id="extraPhotoBtn" onclick="takeExtraPhoto()">📸 ถ่ายรูปเพิ่มให้เลข: -</button>

  <div class="status-box" id="status">โหมดปัจจุบัน: <b>Inbound (รับเข้า)</b></div>

  <div class="input-group">
    <input type="text" id="manualTracking" placeholder="หรือพิมพ์เลข Tracking..." onkeypress="if(event.key==='Enter') submitManual()">
    <button id="submitBtn" class="action-btn" onclick="submitManual()">บันทึก</button>
  </div>

  <div class="history" id="historyList"></div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwIQDhroRButPGIUw_XdTUE8Tk3feXLt8WIbJV-M_erhh55n_Johd9MkZHDz79hqE_p1Q/exec";

    let currentMode = 'Inbound';
    let isProcessing = false;
    let lastScanned = "";
    let lastScanTime = 0;
    let activeTrackingForPhoto = "";
    let isCameraOpen = false;
    const html5QrCode = new Html5Qrcode("reader");

    function setMode(mode) {
      currentMode = mode;
      lastScanned = "";
      
      const btnIn = document.getElementById('btnInbound');
      const btnOut = document.getElementById('btnOutbound');
      const header = document.getElementById('headerTitle');
      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');
      const submitBtn = document.getElementById('submitBtn');

      if (mode === 'Inbound') {
        btnIn.className = 'mode-btn active-inbound';
        btnOut.className = 'mode-btn';
        header.innerText = '📦 KIS Scanner (INBOUND)';
        header.style.color = '#00e676';
        startBtn.style.background = '#00e676';
        startBtn.style.color = '#000';
        submitBtn.style.background = '#00e676';
        submitBtn.style.color = '#000';
        statusEl.innerHTML = 'โหมดปัจจุบัน: <b style="color:#00e676;">Inbound (รับเข้า)</b>';
      } else {
        btnIn.className = 'mode-btn';
        btnOut.className = 'mode-btn active-outbound';
        header.innerText = '🚚 KIS Scanner (OUTBOUND)';
        header.style.color = '#64b5f6';
        startBtn.style.background = '#2979ff';
        startBtn.style.color = '#fff';
        submitBtn.style.background = '#2979ff';
        submitBtn.style.color = '#fff';
        statusEl.innerHTML = 'โหมดปัจจุบัน: <b style="color:#64b5f6;">Outbound (ส่งออก)</b>';
      }
    }

    function playBeep(isSuccess = true) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = isSuccess ? 'sine' : 'sawtooth';
      osc.frequency.setValueAtTime(isSuccess ? 1000 : 300, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    }

    function captureCompressedFrame(forceCapture = false) {
      if (!forceCapture && !document.getElementById('autoPhoto').checked) return null;
      const video = document.querySelector('#reader video');
      if (!video || video.videoWidth === 0) return null;

      // ความกว้าง 1150px คุณภาพ 0.78 (สมดุลระหว่างความคมชัดและขนาดไฟล์)
      const maxWidth = 1150;
      const scale = Math.min(1, maxWidth / video.videoWidth);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.78);
    }

    function startCamera() {
      const startBtn = document.getElementById('startBtn');
      const readerEl = document.getElementById('reader');
      const statusEl = document.getElementById('status');

      startBtn.style.display = 'none';
      readerEl.style.display = 'block';
      statusEl.innerText = "กำลังเปิดกล้อง...";

      // ขอความละเอียดระดับ HD (1280x720) เพื่อให้กล้องโฟกัสชัดขึ้นแต่ไม่กินทรัพยากร
      const scanConfig = {
        fps: 15,
        qrbox: { width: 280, height: 140 },
        aspectRatio: 1.5,
        videoConstraints: {
          facingMode: "environment",
          width: { ideal: 1280 },
          height: { ideal: 720 },
          focusMode: "continuous"
        }
      };

      html5QrCode.start(
        { facingMode: "environment" },
        scanConfig,
        onScanSuccess
      ).then(() => {
        isCameraOpen = true;
        statusEl.innerHTML = `พร้อมสแกน (${currentMode})...`;
        statusEl.style.color = "#ffffff";
        updateExtraPhotoButton();
      }).catch(err => {
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 280, height: 140 }, aspectRatio: 1.5 },
          onScanSuccess
        ).then(() => {
          isCameraOpen = true;
          statusEl.innerHTML = `พร้อมสแกน (${currentMode})...`;
          statusEl.style.color = "#ffffff";
          updateExtraPhotoButton();
        }).catch(fallbackErr => {
          isCameraOpen = false;
          startBtn.style.display = 'inline-block';
          readerEl.style.display = 'none';
          statusEl.innerText = "ไม่สามารถเปิดกล้องได้: " + fallbackErr;
          statusEl.style.color = "#ff5252";
        });
      });
    }

    function updateExtraPhotoButton() {
      const btn = document.getElementById('extraPhotoBtn');
      if (isCameraOpen && activeTrackingForPhoto) {
        btn.style.display = 'block';
        btn.innerText = `📸 ถ่ายรูปเพิ่มให้เลข: ${activeTrackingForPhoto}`;
      }
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (isProcessing || (decodedText === lastScanned && now - lastScanTime < 3000)) {
        return;
      }

      isProcessing = true;
      lastScanned = decodedText;
      lastScanTime = now;

      const imageBase64 = captureCompressedFrame(false);

      playBeep(true);
      if (navigator.vibrate) navigator.vibrate(100);

      processTracking(decodedText, imageBase64, false);
    }

    function submitManual() {
      const input = document.getElementById('manualTracking');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      const imageBase64 = captureCompressedFrame(false);
      processTracking(val, imageBase64, false);
    }

    function takeExtraPhoto() {
      if (isProcessing || !activeTrackingForPhoto) return;
      
      const imageBase64 = captureCompressedFrame(true);
      if (!imageBase64) {
        alert("กรุณาเปิดกล้องก่อนกดถ่ายรูปเพิ่ม");
        return;
      }

      isProcessing = true;
      playBeep(true);
      if (navigator.vibrate) navigator.vibrate(80);

      processTracking(activeTrackingForPhoto, imageBase64, true);
    }

    async function processTracking(tracking, imageBase64 = null, isExtraPhoto = false) {
      const statusEl = document.getElementById('status');
      const extraBtn = document.getElementById('extraPhotoBtn');
      const noteVal = document.getElementById('noteInput').value.trim();
      
      extraBtn.disabled = true;
      if (isExtraPhoto) {
        statusEl.innerHTML = `📸 กำลังอัปโหลดรูปเพิ่มเติมของ: <b>${tracking}</b>...`;
        statusEl.style.color = '#ffd600';
      } else {
        const photoText = imageBase64 ? ' + 📸 รูปภาพ' : '';
        statusEl.innerHTML = `⏳ กำลังบันทึก [${currentMode}${photoText}]: <b>${tracking}</b>...`;
        statusEl.style.color = '#ffd600';
      }

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ 
            tracking: tracking,
            status: currentMode,
            note: noteVal,
            image: imageBase64,
            isExtraPhoto: isExtraPhoto
          })
        });
        const res = await response.json();
        isProcessing = false;
        extraBtn.disabled = false;

        if (res.success) {
          activeTrackingForPhoto = res.tracking;
          updateExtraPhotoButton();

          if (res.isExtraPhoto) {
            statusEl.innerHTML = `📸 <b>บันทึกรูปเพิ่มเติมแล้ว:</b> ${res.tracking}<br><small>${res.timestamp}</small>`;
            statusEl.style.color = '#ffd600';
          } else if (res.isDuplicate) {
            playBeep(false);
            statusEl.innerHTML = `⚠️ <b>ยิงซ้ำ (${res.status})!</b> ${res.tracking}<br><small>${res.timestamp}</small>`;
            statusEl.style.color = '#ff9100';
          } else {
            const color = res.status === 'Inbound' ? '#00e676' : '#64b5f6';
            const imgBadge = res.imageUrl ? ' | 📸 บันทึกรูปแล้ว' : '';
            statusEl.innerHTML = `✅ <b>บันทึก ${res.status}:</b> ${res.tracking}<br><small>${res.timestamp}${imgBadge}</small>`;
            statusEl.style.color = color;
          }
          addHistory(res);
        } else {
          throw new Error(res.error || 'Unknown error');
        }
      } catch (err) {
        isProcessing = false;
        extraBtn.disabled = false;
        statusEl.innerHTML = `❌ เกิดข้อผิดพลาด: ${err.message}`;
        statusEl.style.color = '#ff5252';
      }
    }

    function addHistory(res) {
      const list = document.getElementById('historyList');
      const div = document.createElement('div');
      const isOut = res.status === 'Outbound';
      const photoLink = (res.imageUrl && res.imageUrl.startsWith('http')) 
        ? `<a class="photo-link" href="${res.imageUrl}" target="_blank">🖼️ ดูรูป</a>` 
        : '';

      let itemClass = 'history-item' + (isOut ? ' outbound' : '');
      if (res.isExtraPhoto) itemClass += ' extra';
      else if (res.isDuplicate) itemClass += ' dup';

      const extraBadge = res.isExtraPhoto ? ` <span class="badge extra">+รูปเพิ่ม</span>` : '';

      div.className = itemClass;
      div.innerHTML = `
        <div>
          <strong>${res.tracking}</strong> <span class="badge ${isOut ? 'out' : 'in'}">${res.status}</span>${extraBadge}${photoLink}<br>
          <span class="time">${res.timestamp} ${res.note ? '• ' + res.note : ''}</span>
        </div>
        <div>${res.isExtraPhoto ? '📸' : (res.isDuplicate ? '⚠️ ซ้ำ' : '✅')}</div>
      `;
      list.prepend(div);
    }
  </script>
</body>
</html>
